[project]
name = "cml2graph"
version = "0.1.0"
description = "Conceptual Modeling Languages to Graph"
readme = "README.md"
authors = [
    { name = "salvprest", email = "okushos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
